name: konon-mindmap
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.cloud
    image: konon-mindmap:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://mindmap:${POSTGRES_PASSWORD}@db:5432/mindmap
      PUBLIC_URL: https://tools-konon.kumuze.top/mindmap/
      COOKIE_SECURE: "true"
      PORT: "3000"
    ports: ["127.0.0.1:18465:3000"]
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=32m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 384m
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3000/mindmap/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mindmap
      POSTGRES_USER: mindmap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["../data/postgres:/var/lib/postgresql/data"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U mindmap -d mindmap"]
      interval: 5s
      timeout: 3s
      retries: 10
